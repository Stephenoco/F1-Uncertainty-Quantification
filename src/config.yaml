# This .yaml file is used to make changes to the hyperparameters of the model
# without having to go into the training and evaluation notebooks.

model:
  input_dim: 27 # do not change, this value is the number of features
  hidden_dim: 128 # if using GRU or LSTM models
  hidden_dim_1: 128
  hidden_dim_2: 64
  dropout_rate: 0.35
  num_classes: 3
  sequence_length: 3 # if using attention
  num_layers: 4 # if using attention

training:
  epochs: 500
  batch_size: 2
  learning_rate: 0.0001

mc_dropout:
  n_passes: 100 # should not be changed

paths:
  processed_dir: src/data/processed
  models_dir: src/models
  model_filename: pit_strategy_Net_22.pth
  config_name: config_22.yaml
  folder_name: test_Net_22
  architecture: PitStrategyNetWithVal