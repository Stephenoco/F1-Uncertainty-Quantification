# This .yaml file is used to make changes to the hyperparameters of the model
# without having to go into the training and evaluation notebooks.

model:
  input_dim: 8 # do not change, this value is the number of features
  hidden_dim_1: 1024
  hidden_dim_2: 512
  dropout_rate: 0.3

training:
  epochs: 300
  batch_size: 64 # with smaller batch sizes the model see pit laps more frequently
  learning_rate: 0.0001

mc_dropout:
  n_passes: 100 # should not be changed

paths:
  processed_dir: src/data/processed
  models_dir: src/models
  model_filename: pit_strategy_net_2.pth
  config_name: config_2.yaml
  folder_name: test2
  results_name: results2.txt